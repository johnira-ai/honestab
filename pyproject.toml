[project]
name = "honestab"
version = "0.1.0"
description = "A/B testing toolkit with simulation-validated statistics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Miller" }]
requires-python = ">=3.11"
keywords = ["ab-testing", "experimentation", "statistics", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/johnira-ai/honestab"
Source = "https://github.com/johnira-ai/honestab"
Issues = "https://github.com/johnira-ai/honestab/issues"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "pytest>=8.0",
]
lint = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "ruff>=0.6",
    "scipy-stubs>=1.15",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "NPY", # numpy-specific rules
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]
allowed-confusables = ["–"]  # en dash, as in "Welch–Satterthwaite"
ignore = [
    "SIM108", # ternaries are not always clearer than if/else
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
filterwarnings = ["error"]
